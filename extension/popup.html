        <button id="settings-toggle" class="icon-button interactive-frame" type="button" aria-label="Настройки" title="Настройки" aria-controls="settings-view" aria-expanded="false"><svg class="icon" aria-hidden="true" id="settings-icon"><use href="#icon-settings-2"/></svg><svg class="icon" aria-hidden="true" id="back-icon" hidden><use href="#icon-chevron-left"/></svg></button>
      </header>
      <h1 id="view-title">Экспорт чата</h1>
      <section id="export-view" aria-label="Экспорт чата">
        <div class="actions" aria-label="Формат экспорта">
          <button class="format interactive-frame" type="button" data-format="markdown"><svg class="icon" aria-hidden="true" ><use href="#icon-download"/></svg><span>Markdown</span></button>
          <button class="format interactive-frame" type="button" data-format="json"><svg class="icon" aria-hidden="true" ><use href="#icon-download"/></svg><span>JSON</span></button>
        </div>
      </section>
      <section id="settings-view" aria-label="Настройки" hidden>
        <div class="setting-row">
          <label for="mode">Экспорт</label>
          <span class="select-shell"><select id="mode"><option value="api" selected>Напрямую</option><option value="scroll">С прокруткой</option></select><svg class="icon" aria-hidden="true" ><use href="#icon-chevron-down"/></svg></span>
        </div>
        <div class="setting-row">
          <label for="theme">Тема</label>
          <span class="select-shell"><select id="theme"><option value="system">Система</option><option value="dark">Тёмная</option><option value="light">Светлая</option></select><svg class="icon" aria-hidden="true" ><use href="#icon-chevron-down"/></svg></span>
        </div>
        <button type="button" id="diagnose" class="text-button"><svg class="icon" aria-hidden="true" ><use href="#icon-bug"/></svg><span>Диагностика</span></button>
        <div id="diagnostic-panel" hidden>
          <textarea id="diagnostic-output" aria-label="Диагностическая сводка" readonly spellcheck="false" rows="9"></textarea>
        </div>
      </section>
      <div id="feedback">
        <span id="spinner" aria-hidden="true" hidden></span>
        <svg class="icon" aria-hidden="true" id="done-icon" hidden><use href="#icon-check"/></svg>
        <p id="status" role="status" aria-live="polite"></p>
        <button type="button" id="cancel" class="feedback-action icon-button" aria-label="Отменить" title="Отменить" hidden><svg class="icon" aria-hidden="true" ><use href="#icon-x"/></svg></button>
        <button type="button" id="restart" class="feedback-action icon-button" aria-label="Запросить заново" title="Запросить заново" hidden><svg class="icon" aria-hidden="true" ><use href="#icon-refresh-cw"/></svg></button>
      </div>
      <button type="button" id="partial" class="text-button" hidden>Сохранить неполный экспорт</button>
    </main>
  </body>
</html>
