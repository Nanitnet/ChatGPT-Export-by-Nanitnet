<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Большая переписка — ChatGPT</title>
<style>
body { margin: 0; font: 14px/1.4 sans-serif; }
#scroll { height: 600px; overflow-y: auto; overflow-anchor: none; }
ol { list-style: none; padding: 0; margin: 0; position: relative; }
li { box-sizing: border-box; height: 120px; padding: 8px; overflow: hidden; width: 100%; }
p, pre { margin: 0; } [data-user-message-bubble] { white-space: pre-wrap; }
</style></head><body>
<main><div id="scroll" data-scroll-root><ol data-conversation-transcript aria-label="Conversation transcript"></ol></div></main>
<script nonce="fixture-only">
(() => {
  const options = new URLSearchParams(location.search);
  const total = Number(options.get('count') || 1000);
  const mode = options.get('mode') || 'recycle';
  const missing = Number(options.get('missing') || -1);
  const scroller = document.querySelector('#scroll');
  const list = document.querySelector('ol');
  const rowHeight = 120;
  let lower = mode === 'recycle' ? Math.max(0, total - 200) : 0;
  let hydrationTimer;
  let pageLoading = false;
  window.__fixtureStats = { total, mode, paginationLoads: 0, renders: 0, maxHydrated: 0, firstSeen: total, lastSeen: -1 };
  function create(index) {
    const node = document.createElement('li');
    node.id = `large-message-${index}`;
    node.dataset.messageRole = index % 2 ? 'assistant' : 'user';
    node.setAttribute('aria-posinset', index + 1);
    node.setAttribute('aria-setsize', total);
    if (mode === 'recycle') { node.style.position = 'absolute'; node.style.top = `${(index - lower) * rowHeight}px`; }
    return node;
  }
  function fill(node, index) {
    if (index === missing) return;
    const body = document.createElement('div');
    const text = document.createElement('p');
    // Equal text in distinct turns must survive deduplication.
    text.textContent = index % 20 === 0 ? 'Повторяющийся вопрос' : `Сообщение ${String(index).padStart(4, '0')}: ` + 'длинная проверочная переписка '.repeat(12);
    if (index % 2) { body.dataset.assistantMarkdownRoot = ''; body.dataset.assistantMarkdown = ''; node.dataset.messageComplete = ''; }
    else { body.dataset.userMessageBubble = ''; text.dataset.userMessageCopy = ''; }
    body.append(text);
    if (index % 10 === 1) {
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.className = 'language-js'; code.textContent = `const messageIndex = ${index};\n\nconsole.log(messageIndex);`;
      pre.append(code); body.append(pre);
    }
    node.append(body);
  }
  function render() {
    const start = Math.max(lower, lower + Math.floor(scroller.scrollTop / rowHeight) - 2);
    const end = Math.min(total, start + 11);
    if (mode === 'recycle') {
      list.replaceChildren();
      for (let index = start; index < end; index++) { const node = create(index); fill(node, index); list.append(node); }
    } else {
      for (let index = 0; index < total; index++) {
        const node = list.children[index];
        node.replaceChildren();
        if (index >= start && index < end) fill(node, index);
      }
    }
    list.setAttribute('aria-busy', pageLoading ? 'true' : 'false');
    const stats = window.__fixtureStats;
    stats.renders++;
    stats.maxHydrated = Math.max(stats.maxHydrated, list.querySelectorAll('[data-assistant-markdown-root],[data-user-message-bubble]').length);
    stats.firstSeen = Math.min(stats.firstSeen, start); stats.lastSeen = Math.max(stats.lastSeen, end - 1);
  }
  if (mode !== 'recycle') for (let index = 0; index < total; index++) list.append(create(index));
  function resize() { list.style.height = `${(total - lower) * rowHeight}px`; }
  resize();
  scroller.scrollTop = scroller.scrollHeight;
  render();
  scroller.addEventListener('scroll', () => {
    clearTimeout(hydrationTimer);
    list.setAttribute('aria-busy', 'true');
    hydrationTimer = setTimeout(render, 70);
    if (scroller.scrollTop <= 1 && lower > 0 && !pageLoading) {
      pageLoading = true;
      list.setAttribute('aria-busy', 'true');
      setTimeout(() => {
        const previous = lower;
        lower = Math.max(0, lower - 100);
        resize();
        scroller.scrollTop += (previous - lower) * rowHeight;
        pageLoading = false;
        window.__fixtureStats.paginationLoads++;
        render();
      }, 550);
    }
  });
})();
</script></body></html>
